version: '3.8'

services:
  # FastAPI REST API Microservice
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrivision_api
    restart: unless-stopped
    environment:
      - APP_MODE=api
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Web User Interface
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrivision_web
    restart: unless-stopped
    environment:
      - APP_MODE=streamlit
      - PORT=8501
    ports:
      - "8501:8501"
    depends_on:
      - api
